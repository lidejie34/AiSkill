name: dev-pipeline-7agents
display_name: 7Agent分文件标准化端到端研发流水线
description: 1总控+6专项Agent独立目录拆分，全链路需求先行、TDD强制、高危弹窗确认，禁止跳过设计、禁止零测试交付
priority: 100
auto_bootstrap: true
override_default_flow: true
replace_skill: using-superpowers
allow_external_skills: true
external_skills:
  - tiexin-doc
  - matrix
run_mode: once
permissions:
  - file:read
  - file:write
  - file:delete
  - shell:git
  - shell:gh
  - shell:npm
  - shell:matrix
  - deploy:execute
  - context:global-rw
  - user:dialog-all
global_constraints:
  disable_skylog: true
  all_risky_ops_mandatory_confirm: true
  forbid_skip_demand_design: true
  forbid_zero_test_release: true
  rollback_rule: single_reject_rollback_stage, double_reject_support_terminate
  forbid_write_doc_outside_spec_dir: true
  forbid_delete_outside_spec_root: true

# 需求文档工作区：所有项目共用一个根目录，每个需求独占一个子目录
spec_workspace:
  root: /Users/lidejie/aiSpecs
  layout: flat                      # 单层平铺，不按项目再分层
  dir_pattern: "{date}-{project}-{slug}"   # date=YYYYMMDD, project=代码仓库目录名, slug=需求短名
  subdirs:
    requirements_dir: requirements  # 需求源文档 + 需求澄清产出
    design_dir: design              # 技术方案 + DDD/BDD/OpenAPI
    reports_dir: reports            # 各阶段机器可读日志与流水线报告
    history_dir: .history           # 驳回重跑时的旧版本归档
  rerun_policy: archive_to_history  # 同名目录已存在：旧文件归档为 <basename>.v<N>.<ext>，不新建目录
  meta_file: pipeline_meta.json     # run 元信息（slug/项目/仓库路径/源URL/fid/创建时间）
  git_tracked: false                # 位于代码仓库之外，任何阶段都不纳入 git 提交
  resolved_by: agent-pipeline-controller  # 仅总控在 step_1 解析并落盘绝对路径

agent_register_list:
  - agent_ref: agent-pipeline-controller
    agent_config: file://./agents/agent-pipeline-controller/config.yaml
  - agent_ref: agent-demand
    agent_config: file://./agents/agent-demand/config.yaml
  - agent_ref: agent-plan
    agent_config: file://./agents/agent-plan/config.yaml
  - agent_ref: agent-matrix
    agent_config: file://./agents/agent-matrix/config.yaml
  - agent_ref: agent-git
    agent_config: file://./agents/agent-git/config.yaml
  - agent_ref: agent-tdd
    agent_config: file://./agents/agent-tdd/config.yaml
  - agent_ref: agent-final-ops
    agent_config: file://./agents/agent-final-ops/config.yaml

pipeline_flow_sequence:
  step_1:
    dispatch_agent: agent-pipeline-controller
    action: init_global_context && resolve_spec_dir
    note: 必须在任何子Agent调度与Wiki导出之前，解析并创建需求目录，将绝对路径写入全局上下文
  step_2:
    dispatch_agent: agent-demand
    pre_condition: true
    block_rule: output audit not pass -> re-run self; double reject -> terminate pipeline
  step_3:
    dispatch_agent: agent-plan
    pre_condition: agent-demand audit pass
    block_rule: output audit not pass -> re-run self; double reject -> terminate pipeline
  step_4:
    dispatch_agent: agent-matrix
    pre_condition: agent-plan audit pass
    block_rule: |
      must pop create/skip dialog (independent, default create, not cached);
      create -> matrix auth login check -> matrix -- createMatrixTask --title --description
            -> writeback matrix_task_id to global context + task_meta_info.json;
      skip -> user explicit choice -> writeback matrix_skipped: true;
      forbid substitute TaskCreate/session todo for Matrix creation;
      matrix CLI fail / auth fail -> pause pipeline wait manual fix
  step_5:
    dispatch_agent: agent-git
    pre_condition: agent-plan audit pass && workspace exist .git
    action: locate_repo && check_dirty && confirm_base_branch && fetch_pull_base && create_worktree
    block_rule: |
      dirty worktree / ff-only pull fail / worktree create fail -> pause pipeline;
      must writeback dev_workspace_path(worktree path) before step_6
  step_6:
    dispatch_agent: agent-tdd
    pre_condition: agent-plan audit pass && dev_workspace_path resolved
    block_rule: |
      no test deliverable -> block whole pipeline;
      each implementation task pass -> local git add + git commit (incremental, forbid push/merge/rebase/force);
      local commit fail / conflict -> pause pipeline wait manual fix;
      task-level commits complete -> handoff to step_7 for verify + push only
  step_7:
    dispatch_agent: agent-git
    pre_condition: agent-tdd confirm complete && workspace exist .git
    action: verify_incremental_commits_exist && verify_staged_no_spec_dir && commit_confirm_dialog && fetch_prune && push_confirm_dialog && push_dev_branch
    block_rule: |
      must pop commit-confirm and push-confirm dialogs (independent, not cached);
      commit-confirm reject -> back to agent-tdd or manual fix, no silent commit;
      push-confirm reject -> keep local commits, pause before push;
      remote dev branch diverged / conflict -> pause pipeline wait manual fix;
      push_only mode: forbid merge to base, forbid push --force
  step_8:
    dispatch_agent: agent-final-ops
    pre_condition: agent-git finish or no git repo
    block_rule: deploy fail -> pause pipeline
  step_9:
    dispatch_agent: agent-final-ops
    pre_condition: deploy step finish or skip deploy
    block_rule: no block, single file confirm by controller
  step_10:
    dispatch_agent: agent-pipeline-controller
    action: close_loop_check && generate pipeline report

global_dialog_spec:
  audit_dialog_template:
    title: 阶段产出审核确认
    option_1: "{stage}通过，推进下一阶段（推荐）"
    option_2: "{stage}存在问题，重新生成文档"
  risky_operation_dialog:
    rule: every risky action single independent dialog, no merge multiple decisions
    production_deploy_double_confirm: true
    file_delete_single_confirm: true
  dialog_cache_rule:
    default: cache_confirmed_choice
    never_cache:
      - base_branch_confirm       # 每次拉取新分支都必须重新确认
  git_stage_dialogs:
    - target_repo_select          # step_5 多仓库选择
    - dirty_worktree_policy       # stash / 手动提交 / 终止
    - base_branch_confirm         # 默认选中 origin/release，每次新建分支都问，不缓存
    - dev_branch_name_confirm     # 默认 feat/<slug>，可改名
    - existing_branch_policy      # 复用 / 换名 / 终止
    - worktree_remove_confirm     # 默认保留
  git_stage_no_dialog:
    - merge_mode_select           # step_7 固定 push_only，无需询问

name: agent-final-ops
display_name: 部署&文档归档Agent
type: agent-skill
description: 流水线收尾，环境部署、需求/设计文档清理
priority: 60
run_mode: temp
bind_stage: [jean, file-operator]
inherit_parent_global_constraints: false
dialog_owner: agent-pipeline-controller
permissions:
  - file:read
  - file:write
  - file:delete
  - deploy:execute
  - context:read-only
deny_permissions:
  - shell:git
  - shell:npm
  - user:dialog
input_deps:
  - dev_branch
  - all_doc_list
  - spec_dir
  - reports_dir
output_base_dir: reports_dir
output_deliverables:
  - reports/deploy_result.json
  - reports/doc_clean_log.json
delete_scope:
  allow_prefix: spec_dir            # 仅本次需求目录内可删
  forbid_outside_prefix: true       # 越界直接拒绝并上报总控
  forbid_spec_root_itself: true     # 禁止删除 /Users/lidejie/aiSpecs 自身
  forbid_code_repo: true            # 代码仓库内文件永不清理
  keep_history_dir_by_default: true # .history 需用户单独确认才删

name: agent-tdd
display_name: TDD编码测试Agent
type: agent-skill
description: 编码、领域建模、单元测试专用，守住零测试交付底线
priority: 70
run_mode: temp
bind_stage: test-driven-development
inherit_parent_global_constraints: false
dialog_owner: agent-pipeline-controller
permissions:
  - file:read
  - file:write
  - shell:npm
  - shell:git-commit          # 仅本地 git add；commit 上报总控后由 agent-git 执行（禁 push）
  - context:read-only
deny_permissions:
  - shell:git-remote-mutate   # push / merge / rebase / force / branch -D / worktree remove
  - deploy:execute
  - file:delete
  - user:dialog
input_deps:
  - tech_plan_doc
  - dev_workspace_path
  - spec_dir
  - design_dir
output_base_dir: design_dir          # 仅文档类产出；代码与测试留在 dev_workspace_path
output_deliverables:
  - design/ddd_model_doc.md
  - design/bdd_scenarios.md
  - design/openapi.yaml
  - reports/compile_check_report.json
code_deliverables_base_dir: dev_workspace_path
code_deliverables:
  - unit_test_src
  - impl_src
notes: |
  文档类产出写 design_dir / reports_dir；源码与单元测试必须写在代码仓库 dev_workspace_path 内。
  两者不得互串：禁止把测试代码写进 aiSpecs，禁止把设计文档写进代码仓库。
  开发期允许任务级本地 commit（禁 push）；用户删除测试类则改走联调清单，不反复补测。
  push/merge/rebase/force 由 step_7/8 agent-git 在确认后执行。

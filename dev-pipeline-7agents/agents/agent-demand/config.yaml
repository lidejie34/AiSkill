name: agent-demand
display_name: 需求澄清Agent
type: agent-skill
description: 仅负责需求梳理与文档输出，无流程决策、无Git/部署权限
priority: 80
run_mode: temp
bind_stage: grill-me
inherit_parent_global_constraints: false
dialog_owner: agent-pipeline-controller
permissions:
  - file:read
  - file:write
  - context:read-only
deny_permissions:
  - shell:git
  - shell:npm
  - deploy:execute
  - file:delete
  - user:dialog
input_deps:
  - global_business_input
  - requirement_local_md
  - requirement_wiki_url
  - spec_dir
  - requirements_dir
output_base_dir: requirements_dir
output_deliverables:
  - requirements/demand_summary.md
  - requirements/full_demand_doc.md
external_skills:
  - tiexin-doc
notes: |
  Wiki URL 优先由总控经 tiexin-doc 导出为 requirement_local_md；
  demand 以本地 MD 为澄清源，默认禁止 wiki 写回。
  所有产出只写入总控下发的 requirements_dir 绝对路径，禁止自行拼接路径或写入代码仓库。

name: agent-git
display_name: Git工作区管理Agent
type: agent-skill
description: 独占所有Git底层执行操作，仅执行指令，无用户决策权限
priority: 70
run_mode: temp
bind_stage: [using-git-worktrees-init, using-git-worktrees-commit-push-merge]
inherit_parent_global_constraints: false
dialog_owner: agent-pipeline-controller
permissions:
  - file:read
  - file:write
  - shell:git
  - context:read-only
deny_permissions:
  - shell:npm
  - deploy:execute
  - file:delete
  - user:dialog
input_deps:
  - target_repo_info
  - slug
  - reports_dir
git_strategy:
  workspace_mode: worktree                     # 统一 worktree 隔离
  worktree_path_pattern: "{repo_root}/.worktrees/{slug}"
  ignore_worktree_via: .git/info/exclude       # 不改动受版本控制的 .gitignore
  branch_pattern: "feat/{slug}"
  base_branch_preferred: release               # 常用基线，远端存在时作为弹窗默认选中项
  base_branch_detect: [release, origin/HEAD, main, master, develop]
  base_branch_confirm: true                    # 每次拉取新分支确认，不缓存
  base_branch_confirm_cached: false            # 明确禁止缓存
  pull_strategy: ff-only                       # 分叉即暂停，禁止自动 merge/rebase
  fetch_before_branch: true                    # 建分支前必须 fetch + pull
  fetch_before_push: true                      # 推送前必须再次 fetch 比对远端
  dirty_worktree_policy: ask                   # stash / 手动提交 / 终止，由总控弹窗
  existing_branch_policy: ask                  # 复用 / 换名 / 终止，禁止静默复用
  merge_mode: push_only                        # 固定仅推开发分支，不合并基线
  keep_worktree_after_finish: true             # 默认保留，移除需用户确认
forbid:
  - push_force
  - auto_conflict_resolve
  - auto_merge_after_ff_only_fail
  - git_add_spec_dir
  - merge_to_base                             # step_7 不允许合并基线
output_base_dir: reports_dir
output_deliverables:
  - reports/git_op_log.json
  - conflict_flag
context_writeback:
  - dev_workspace_path                         # = worktree 路径，agent-tdd 写代码的唯一依据
  - repo_root
  - dev_branch
  - base_branch
  - base_commit_sha
  - worktree_path
notes: |
  aiSpecs 需求目录位于代码仓库之外，禁止 git add / 提交该目录任何文件；
  dev_workspace_path 指向 worktree 而非主仓库根目录，agent-tdd 必须写入该路径；
  step_5 选定的仓库路径需回传总控写入 pipeline_meta.json，但不得触发需求目录重命名。

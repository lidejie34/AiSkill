defaults:
  environments:
    - product
    - stage
    - uat
    - qa
  query:
    query_hints:
      - traceId
      - requestId
      - orderId
      - hotelOrderId
      - keyword

# 数据库 MCP 绑定（按环境选用；密码只在 ~/.cursor/mcp.json）
databases:
  TETitcDRP-qa:
    display_name: DRP QA 库
    mcp_server: user-mysql-drp-qa
    database: TETitcDRP
    environments:
      - qa
    readonly: true
    query_tool: mysql_query
  TETitcDrpOrder-qa:
    display_name: DRP Order QA 库
    mcp_server: user-mysql-drp-order-qa
    database: TETitcDrpOrder
    environments:
      - qa
    readonly: true
    query_tool: mysql_query


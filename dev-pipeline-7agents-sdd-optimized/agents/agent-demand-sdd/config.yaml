name: agent-demand-sdd
display_name: 需求澄清SDD Subagent
type: agent-skill
priority: 80
run_mode: temp
bind_stage: grill-me
inherit_parent_global_constraints: false
dialog_owner: agent-pipeline-controller-sdd
permissions:
  - file:read
  - file:write
  - context:read-only
deny_permissions:
  - shell:git
  - shell:npm
  - deploy:execute
  - file:delete
  - user:dialog
input_deps:
  - global_business_cache_id
  - requirement_local_md
  - requirement_wiki_url
output_deliverables:
  # SDD缓存调度字段
  - demand_doc_id
  - output_file_hash
  # 原始落地实体文件，向下兼容旧流程
  - demand_summary.md
  - full_demand_doc.md
external_skills:
  - tiexin-doc
notes: |
  Wiki URL 优先由总控经 tiexin-doc 导出为 requirement_local_md；
  demand 以本地 MD 为澄清源，默认禁止 wiki 写回。

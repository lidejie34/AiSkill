name: agent-tdd-sdd
display_name: TDD编码测试SDD Subagent
type: agent-skill
priority: 70
run_mode: temp
bind_stage: test-driven-development
inherit_parent_global_constraints: false
dialog_owner: agent-pipeline-controller-sdd
permissions:
  - file:read
  - file:write
  - shell:npm
  - context:read-only
deny_permissions:
  - shell:git
  - deploy:execute
  - file:delete
  - user:dialog
input_deps:
  - plan_doc_id
  - dev_workspace_path
output_deliverables:
  # SDD缓存调度元数据
  - tdd_doc_id
  - output_file_hash
  # 实体落地文件 新旧兼容
  - ddd_model_doc.md
  - bdd_scenarios.md
  - openapi.yaml
  - unit_test_src
  - compile_check_report
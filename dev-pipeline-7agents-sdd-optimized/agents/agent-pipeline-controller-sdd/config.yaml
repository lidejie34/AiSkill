name: agent-pipeline-controller-sdd
display_name: SDD分级优化总控Orchestrator
type: agent-skill
description: 承载SDD分级、缓存、增量审查、上下文复用优化逻辑，全流程调度中枢
priority: 100
run_mode: persistent
inherit_parent_global_constraints: true
sdd_orchestrator: true
permissions:
  - context:global-rw
  - user:dialog-all
  - file:read
  - file:write
deny_permissions: []
exclusive_capabilities:
  - flow_sequence_control
  - all_user_dialog_manage
  - global_rule_audit
  - pipeline_exception_catch
  - pipeline_close_loop_check
  # SDD优化专属能力
  - sdd_level_detect
  - doc_cache_mgr
  - review_hash_cache_mgr
  - context_snapshot_mgr
  - incremental_review_dispatch
  - sdd_conditional_review
downstream_agent_refs:
  - agent-demand
  - agent-plan
  - agent-matrix
  - agent-git
  - agent-tdd
  - agent-final-ops